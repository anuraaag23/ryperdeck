    <svg class="pointer-events-none fixed -top-[9999px] -left-[9999px] w-0 h-0" aria-hidden="true">

          <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feSpecularLighting in="noise" surfaceScale="2.5" specularConstant="1.2" specularExponent="25" lighting-color="#ffffff" result="specLight">
            <fePointLight x="200" y="-100" z="300" />
          </feSpecularLighting>
          <feComposite in="specLight" in2="SourceGraphic" operator="in" result="specular" />
          <feBlend in="displaced" in2="specular" mode="screen" />
        </filter>
      </defs>
    </svg>
